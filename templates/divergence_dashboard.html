<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divergence Detector Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 16px;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .title {
            font-size: 20px;
            font-weight: 700;
        }
        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .btn {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            padding: 10px 14px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn:hover { border-color: #2563eb; }
        .status {
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            border: 1px solid #e5e7eb;
            background: #ffffff;
            color: #374151;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }
        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
            background: #f8fafc;
        }
        .pair {
            font-weight: 700;
            font-size: 14px;
        }
        .updated {
            font-size: 12px;
            color: #6b7280;
        }
        .chart-wrap {
            padding: 10px;
            min-height: 280px;
        }
        .chart-img {
            width: 100%;
            display: block;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            background: #fff;
        }
        .placeholder {
            height: 260px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            color: #9ca3af;
            font-size: 13px;
        }
        @media (max-width: 768px) {
            .container { padding: 10px; }
            .title { font-size: 18px; }
            .grid { grid-template-columns: 1fr; gap: 10px; }
            .chart-wrap { min-height: 220px; padding: 8px; }
            .placeholder { height: 200px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <div class="title">Divergence Detector Dashboard</div>
        <div class="actions">
            <button id="refreshBtn" class="btn">刷新图表</button>
            <div id="status" class="status">准备就绪</div>
        </div>
    </div>

    <div id="grid" class="grid"></div>
</div>

<script>
    const gridEl = document.getElementById('grid');
    const statusEl = document.getElementById('status');
    const refreshBtn = document.getElementById('refreshBtn');
    const isMobile = window.matchMedia('(max-width: 768px)').matches;

    function setStatus(text) {
        statusEl.textContent = text;
    }

    function renderCards(cards) {
        if (!cards || cards.length === 0) {
            gridEl.innerHTML = '<div class="placeholder">暂无图表数据</div>';
            return;
        }

        gridEl.innerHTML = cards.map(card => {
            const imgUrl = isMobile ? card.mobile_image_url : card.desktop_image_url;
            const updated = card.updated_at || 'N/A';
            return `
                <div class="card">
                    <div class="card-header">
                        <div class="pair">${card.symbol} ${card.timeframe}</div>
                        <div class="updated">更新: ${updated}</div>
                    </div>
                    <div class="chart-wrap">
                        <img class="chart-img" src="${imgUrl}" alt="${card.symbol} ${card.timeframe} divergence" loading="lazy" />
                    </div>
                </div>
            `;
        }).join('');
    }

    async function loadOverview() {
        setStatus('检查并加载中...');
        try {
            const resp = await fetch('/api/divergence/overview');
            const json = await resp.json();
            if (!json.success) {
                throw new Error(json.message || '加载失败');
            }
            renderCards(json.data || []);

            const refreshInfo = json.refresh || {};
            if (refreshInfo.updated) {
                setStatus('已触发更新并加载完成');
            } else {
                setStatus('数据已是4小时内最新');
            }
        } catch (err) {
            console.error(err);
            setStatus('加载失败: ' + err.message);
            gridEl.innerHTML = '<div class="placeholder">加载失败，请稍后重试</div>';
        }
    }

    async function forceRefresh() {
        refreshBtn.disabled = true;
        setStatus('正在强制刷新，请稍候...');
        try {
            const resp = await fetch('/api/divergence/refresh', { method: 'POST' });
            const json = await resp.json();
            if (!json.success) {
                throw new Error(json.message || '刷新失败');
            }
            setStatus('刷新完成，正在重载图表...');
            await loadOverview();
        } catch (err) {
            console.error(err);
            setStatus('刷新失败: ' + err.message);
        } finally {
            refreshBtn.disabled = false;
        }
    }

    refreshBtn.addEventListener('click', forceRefresh);
    document.addEventListener('DOMContentLoaded', loadOverview);
</script>
</body>
</html>
