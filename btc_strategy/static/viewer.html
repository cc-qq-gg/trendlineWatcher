<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4h Regime Trade Viewer</title>
  <script src="/vendor/lightweight-charts/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a20; --panel-2: #1f242c; --line: #303743;
      --text: #e8edf4; --muted: #8f9aa8; --long: #23c78a; --short: #ff5a67;
      --ma: #e0b84c; --ma200: #4ea3ff; --equity: #9b8cff; --dd: #ff5a67;
    }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { min-height: 76px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #13161b; display: grid; grid-template-columns: minmax(320px, 1fr) auto; gap: 16px; align-items: center; }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .subtitle { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .controls { display: flex; align-items: end; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: 11px; }
    select, button { height: 34px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 6px; padding: 0 10px; font-size: 13px; }
    #strategyFilter { min-width: 230px; }
    button { cursor: pointer; }
    /* 顶部四档区间收益：分段按钮，点选后缩放图表并过滤逐笔交易，切换策略时重算 */
    .loadError { display: flex; align-items: center; gap: 12px; margin: 8px 16px 0; padding: 10px 14px; border: 1px solid #6b3a3a; border-radius: 8px; background: #241a1a; color: #e0a0a0; font-size: 13px; }
    .loadError button { height: auto; padding: 4px 12px; border: 1px solid #6b3a3a; border-radius: 6px; background: #2e1f1f; color: #e0a0a0; cursor: pointer; }
    .loadError button:hover { background: #3a2727; }
    .spanBar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); flex: 0 0 auto; margin: 8px 16px 0; max-width: 720px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
    /* 覆盖全局 button 的 34px 固定高，否则两行内容会被裁 */
    .spanCell { min-width: 0; height: auto; padding: 7px 10px 8px; border: 0; border-left: 1px solid var(--line); background: transparent; color: var(--muted); font: inherit; text-align: center; cursor: pointer; }
    .spanCell:first-child { border-left: 0; }
    .spanCell:hover { background: #1b2027; }
    .spanCell.active { background: #27303b; color: var(--text); }
    .spanCell span { display: block; color: inherit; opacity: .8; font-size: 11px; letter-spacing: .4px; }
    /* 四格固定一行：数字不换行，窄屏字号随视口收缩 */
    .spanCell strong { display: block; margin-top: 3px; font-size: 16px; white-space: nowrap; overflow: hidden; font-variant-numeric: tabular-nums; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; flex: 1 1 0; min-height: 0; }
    .charts { min-width: 0; padding: 12px; display: grid; grid-template-rows: 50% 50%; gap: 10px; }
    .chartBlock { min-height: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; position: relative; display: grid; grid-template-rows: 28px minmax(0, 1fr); }
    .chartTitle { display: flex; align-items: center; justify-content: space-between; padding: 0 10px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .chartHost { min-height: 0; }
    .chartTooltip { position: absolute; z-index: 2; top: 34px; left: 10px; max-width: calc(100% - 20px); padding: 5px 8px; border: 1px solid var(--line); border-radius: 4px; background: rgba(15,17,21,.92); color: var(--text); font-size: 11px; line-height: 1.55; pointer-events: none; }
    /* 回撤副图的标题行：盖在 pane 分界线上，位置由 JS 按 pane 高度算 */
    .ddHead { position: absolute; z-index: 5; height: 20px; line-height: 20px; padding: 0 10px; background: var(--panel); display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
    .ddHead b { color: var(--text); font-size: 12px; }
    .hidden { display: none !important; }
    aside { border-left: 1px solid var(--line); background: var(--panel); padding: 12px; overflow: auto; }
    /* 指标卡一行三个：9 个指标正好 3×3 ，窄屏也不折行 */
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 6px; margin-bottom: 12px; }
    .stat { min-width: 0; border: 1px solid var(--line); background: #14171d; border-radius: 8px; padding: 7px 8px; }
    .stat span { display: block; color: var(--muted); font-size: 10px; letter-spacing: .2px; white-space: nowrap; }
    .stat strong { display: block; margin-top: 4px; font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .long { color: var(--long); } .short { color: var(--short); } .muted { color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border-bottom: 1px solid var(--line); padding: 7px 4px; text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); z-index: 1; }
    tr.tradeRow { cursor: pointer; }
    tr.tradeRow.active { background: #27303b; }
    tr.annualRow { cursor: pointer; }
    tr.annualRow:hover { background: #1b2027; }
    tr.annualRow.active { background: #27303b; }
    .sectionTitle { margin: 14px 0 7px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
    .tradeDetail { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 9px; border: 1px solid var(--line); border-radius: 8px; background: #14171d; }
    .tradeDetail.empty { display: block; color: var(--muted); font-size: 12px; }
    .tradeDetailItem { min-width: 0; }
    .tradeDetailItem span { display: block; color: var(--muted); font-size: 10px; }
    .tradeDetailItem strong { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
    .tradeCell { white-space: normal; line-height: 1.35; }
    .tradeCell .price { color: var(--text); font-variant-numeric: tabular-nums; }
    .tradeTableWrap { max-height: 40vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
    @media (max-width: 1100px) {
      body { height: auto; overflow: visible; }
      header { grid-template-columns: 1fr; }
      .controls { justify-content: flex-start; }
      main { grid-template-columns: 1fr; flex: 0 0 auto; min-height: 0; height: auto; }
      .spanBar { margin: 6px 8px 0; max-width: none; }
      .spanCell { padding: 6px 8px; }
      .spanCell span { font-size: 10px; }
      .spanCell strong { font-size: clamp(11px, 3.4vw, 15px); }
      .charts { height: 900px; }
      aside { border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>BTC 4h Regime 候选交易查看器</h1>
      <div class="subtitle" id="strategySubtitle">close/no-lookahead，多策略对比；aggressive 作为进攻档候选保留。</div>
    </div>
    <div class="controls">
      <label>策略<select id="strategyFilter"></select></label>
      <label>年份<select id="yearFilter"></select></label>
      <label>类型<select id="typeFilter"><option value="all">全部</option><option value="win">盈利</option><option value="loss">亏损</option><option value="topWin">Top盈利</option><option value="topLoss">Top亏损</option></select></label>
      <label>周期<select id="timeframeFilter"><option value="4h">4h</option><option value="1d">日</option><option value="1w">周</option></select></label>
      <button id="fitButton">全图</button>
    </div>
  </header>
  <section class="spanBar" id="spanBar" aria-label="回测区间总收益"></section>
  <main>
    <section class="charts">
      <div class="chartBlock">
        <div class="chartTitle"><span id="priceChartTitle">BTC 4h K线 + MA11 / MA200D</span><span id="selectedTradeTitle">未选择交易</span></div>
        <div class="chartHost" id="priceChart"></div>
        <div class="chartTooltip hidden" id="priceTooltip"></div>
      </div>
      <div class="chartBlock">
        <div class="chartTitle"><span>策略净值</span><span id="equityTitle">-</span></div>
        <div class="chartHost" id="equityChart"></div>
        <div class="ddHead" id="ddHead"><b>策略回撤</b><span id="ddStats">-</span></div>
        <div class="chartTooltip hidden" id="equityTooltip"></div>
      </div>
    </section>
    <aside>
      <div class="stats" id="stats"></div>
      <div class="sectionTitle"><span>年度收益</span><span class="muted">year equity</span></div>
      <table><thead><tr><th>年</th><th>收益倍数</th><th>年末净值</th><th>回撤</th></tr></thead><tbody id="annualRows"></tbody></table>
      <div class="sectionTitle"><span>选中交易</span><span class="muted">成本归因</span></div>
      <div id="selectedTradeDetail" class="tradeDetail empty">点击下方交易查看价格、手续费、资金费和总磨损。</div>
      <div class="sectionTitle"><span>逐笔交易</span><span id="tradeCountLabel" class="muted"></span></div>
      <div class="tradeTableWrap">
        <table>
          <thead><tr><th>#</th><th>入场</th><th>出场</th><th>净收益</th><th>磨损</th><th>K</th></tr></thead>
          <tbody id="tradeRows"></tbody>
        </table>
      </div>
    </aside>
  </main>
  <script>
    // 数据由 /api/btc-strategy/payload 提供（gzip）；页面不再内嵌 15.8MB 快照，首屏传输从 ~32MB 降到 ~3MB
    let PAYLOAD = null;
    let DATA = null;
    const appState = {
      charts: [], chartMeta: new Map(), activeTradeId: null, activeYear: 'all',
      activeSpan: 'all', timeframe: '1d', viewCache: null,
      rangeSync: { owner: null, frame: null, releaseFrame: null, applying: false, range: null, logicalRange: null },
      crosshairSync: { owner: null, frame: null, releaseFrame: null, applying: false, pending: null }
    };
    const colors = {
      bg: '#171a20', text: '#dce3ec', grid: '#252b35',
      long: '#23c78a', short: '#ff5a67', ma: '#e0b84c', ma200: '#4ea3ff', equity: '#9b8cff', dd: '#ff5a67'
    };
    let priceSeries, maSeries, ma200Series, equitySeries, drawdownSeries, markerPrimitive;

    function assertChartLibrary() {
      if (!window.LightweightCharts) throw new Error('Lightweight Charts 加载失败，请检查 vendor 文件。');
    }
    function chartOptions() {
      return {
        layout: { background: { color: colors.bg }, textColor: colors.text },
        grid: { vertLines: { color: colors.grid }, horzLines: { color: colors.grid } },
        rightPriceScale: { borderColor: '#303743' },
        timeScale: { borderColor: '#303743', timeVisible: appState.timeframe === '4h', secondsVisible: false, rightOffset: 8, barSpacing: 8, lockVisibleTimeRangeOnResize: true },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        localization: { locale: 'zh-CN' }
      };
    }
    function createBaseChart(containerId) {
      const container = document.getElementById(containerId);
      const chart = LightweightCharts.createChart(container, { ...chartOptions(), width: container.clientWidth, height: container.clientHeight });
      appState.charts.push(chart);
      appState.chartMeta.set(containerId, { chart, series: null });
      return chart;
    }
    function registerPrimarySeries(containerId, series) {
      const meta = appState.chartMeta.get(containerId);
      if (meta) meta.series = series;
    }
    function syncVisibleRange(sourceChart) {
      sourceChart.timeScale().subscribeVisibleTimeRangeChange(range => {
        const sync = appState.rangeSync;
        if (!range || sync.applying) return;
        if (sync.owner && sync.owner !== sourceChart) return;
        sync.owner = sourceChart;
        sync.range = range;
        sync.logicalRange = sourceChart.timeScale().getVisibleLogicalRange ? sourceChart.timeScale().getVisibleLogicalRange() : null;
        if (sync.frame) return;
        sync.frame = requestAnimationFrame(() => {
          sync.frame = null;
          const owner = sync.owner;
          if (!owner) return;
          sync.applying = true;
          appState.chartMeta.forEach(meta => {
            if (meta.chart === owner) return;
            if (sync.logicalRange && meta.chart.timeScale().setVisibleLogicalRange) meta.chart.timeScale().setVisibleLogicalRange(sync.logicalRange);
            else meta.chart.timeScale().setVisibleRange(sync.range);
          });
          sync.releaseFrame = requestAnimationFrame(() => {
            sync.applying = false; sync.owner = null; sync.range = null; sync.logicalRange = null; sync.releaseFrame = null;
          });
        });
      });
    }
    function rowForTime(time) { return viewBars().find(row => row.time === time) || null; }
    function nearestRow(time, key) {
      const exact = rowForTime(time);
      if (exact && Number.isFinite(exact[key])) return exact;
      return viewBars().filter(row => Number.isFinite(row[key])).reduce((best, row) => !best || Math.abs(row.time - time) < Math.abs(best.time - time) ? row : best, null);
    }
    function numberText(value, digits = 2) { return Number.isFinite(value) ? Number(value).toFixed(digits) : '-'; }
    function pctText(value) { return Number.isFinite(value) ? `${(value * 100).toFixed(2)}%` : '-'; }
    function timeText(time) {
      const date = new Date(time * 1000);
      // 日/周 桶按 UTC 切，展示也用 UTC 日期，避免日线显示成本地 08:00
      return appState.timeframe === '4h' ? date.toLocaleString('zh-CN', { hour12: false }) : date.toLocaleDateString('zh-CN', { timeZone: 'UTC' });
    }
    function regimeText(value) {
      if (value > 0) return 'risk-on';
      if (value < 0) return 'risk-off';
      return 'neutral';
    }
    function tooltipFor(chartId, time) {
      const row = rowForTime(time) || nearestRow(time, chartId === 'equityChart' ? 'equity' : 'close');
      if (!row) return '';
      if (chartId === 'priceChart') {
        const ohlc = `${timeText(row.time)}　开 ${numberText(row.open)}　高 ${numberText(row.high)}　低 ${numberText(row.low)}　收 ${numberText(row.close)}`;
        // 日/周视图的 MA 是 4h 均线采样值，直接展示会误导，只标当前周期
        if (appState.timeframe === '4h') return `${ohlc}<br>MA11 ${numberText(row.ma)}　MA200D ${numberText(row.ma200d)}　杠杆 ${numberText(row.leverage, 2)}　${regimeText(row.regimeState)}`;
        const period = appState.timeframe === '1d' ? '日K' : '周K';
        return `${ohlc}<br>${period}　杠杆 ${numberText(row.leverage, 2)}　${regimeText(row.regimeState)}`;
      }
      return `${timeText(row.time)}　净值 ${numberText(row.equity, 4)}　回撤 ${pctText(row.drawdown)}`;
    }
    function updateChartTooltips(time) {
      appState.chartMeta.forEach((meta, chartId) => {
        const tooltip = document.getElementById(chartId.replace('Chart', 'Tooltip'));
        if (!tooltip) return;
        const content = tooltipFor(chartId, time);
        tooltip.innerHTML = content;
        tooltip.classList.toggle('hidden', !content);
      });
    }
    function clearCrosshairAndTooltips() {
      appState.chartMeta.forEach(meta => meta.chart.clearCrosshairPosition());
      document.querySelectorAll('.chartTooltip').forEach(tooltip => tooltip.classList.add('hidden'));
    }
    function syncCrosshair(sourceChart) {
      sourceChart.subscribeCrosshairMove(param => {
        const sync = appState.crosshairSync;
        if (sync.applying) return;
        if (!param.point) {
          if (!sync.owner || sync.owner === sourceChart) {
            sync.owner = null;
            if (sync.frame) cancelAnimationFrame(sync.frame);
            sync.frame = null;
            clearCrosshairAndTooltips();
          }
          return;
        }
        if (sync.owner && sync.owner !== sourceChart) return;
        const time = param.time || sourceChart.timeScale().coordinateToTime(param.point.x);
        if (!time) return;
        sync.owner = sourceChart;
        sync.pending = { sourceChart, time };
        if (sync.frame) return;
        sync.frame = requestAnimationFrame(() => {
          sync.frame = null;
          if (!sync.pending || sync.pending.sourceChart !== sync.owner) return;
          const pending = sync.pending;
          sync.applying = true;
          appState.chartMeta.forEach((meta, chartId) => {
            if (meta.chart === pending.sourceChart || !meta.series) return;
            const key = chartId === 'equityChart' ? 'equity' : 'close';
            const row = nearestRow(pending.time, key);
            if (row && Number.isFinite(row[key])) meta.chart.setCrosshairPosition(row[key], row.time, meta.series);
          });
          updateChartTooltips(pending.time);
          sync.releaseFrame = requestAnimationFrame(() => {
            sync.applying = false; sync.owner = null; sync.pending = null; sync.releaseFrame = null;
          });
        });
      });
    }
    // 周期视图：payload 只有 4h，日/周在前端聚合；桶按 UTC 切，周桶从周一起
    const DAY_SECONDS = 86400;
    function utcDayStart(time) { return Math.floor(time / DAY_SECONDS) * DAY_SECONDS; }
    function utcWeekStart(time) {
      const day = (new Date(time * 1000).getUTCDay() + 6) % 7; // 周一=0
      return utcDayStart(time - day * DAY_SECONDS);
    }
    function bucketTime(time) {
      if (appState.timeframe === '1d') return utcDayStart(time);
      if (appState.timeframe === '1w') return utcWeekStart(time);
      return time;
    }
    // 聚合字段：OHLC 首尾/极值，equity 取桶末（净值连续），其余指标取桶末采样
    function aggregateBars(bars, timeframe) {
      if (timeframe === '4h') return bars;
      const bucketOf = timeframe === '1d' ? utcDayStart : utcWeekStart;
      const out = [];
      let current = null;
      for (const row of bars) {
        const bucket = bucketOf(row.time);
        if (!current || current.time !== bucket) {
          current = { time: bucket, open: row.open, high: row.high, low: row.low, close: row.close, ma: row.ma, ma200d: row.ma200d, leverage: row.leverage, regimeState: row.regimeState, equity: row.equity, drawdown: 0 };
          out.push(current);
        } else {
          current.high = Math.max(current.high, row.high);
          current.low = Math.min(current.low, row.low);
          current.close = row.close;
          current.ma = row.ma;
          current.ma200d = row.ma200d;
          current.leverage = row.leverage;
          current.regimeState = row.regimeState;
          current.equity = row.equity;
        }
      }
      // 回撤按聚合后的净值重新累计，否则只看桶末会把回撤「抹浅」
      let peak = -Infinity;
      out.forEach(bar => {
        peak = Math.max(peak, bar.equity);
        bar.drawdown = peak > 0 ? bar.equity / peak - 1 : 0;
      });
      return out;
    }
    // 聚合结果按 dataset + 周期缓存，悬停/绘制/统计都复用
    function viewBars() {
      const cache = appState.viewCache;
      const key = `${DATA.key}|${DATA.bars.length}|${appState.timeframe}`;
      if (cache && cache.key === key) return cache.bars;
      const bars = aggregateBars(DATA.bars, appState.timeframe);
      appState.viewCache = { key, bars };
      return bars;
    }
    function candleData(rows) { return rows.map(row => ({ time: row.time, open: row.open, high: row.high, low: row.low, close: row.close })); }
    function lineData(rows, key) { return rows.filter(row => row[key] !== null && row[key] !== undefined).map(row => ({ time: row.time, value: row[key] })); }
    function displayTrades() {
      return DATA.openPosition ? [...DATA.trades, DATA.openPosition] : DATA.trades.slice();
    }
    function tradeMarkers(trades) {
      const markers = [];
      trades.forEach(trade => {
        // marker time 必须落在 series 数据点上，日/周视图要吸附到所属桶
        markers.push({ time: bucketTime(trade.entryTime), position: 'belowBar', color: colors.long, shape: 'arrowUp', text: `L${trade.id}`, size: trade.id === appState.activeTradeId ? 2 : 1.15 });
        if (!trade.isOpen) {
          markers.push({ time: bucketTime(trade.exitTime), position: 'aboveBar', color: trade.return >= 0 ? colors.long : colors.short, shape: 'arrowDown', text: trade.return >= 0 ? '赢' : '损', size: trade.id === appState.activeTradeId ? 2 : 1.15 });
        }
      });
      return markers;
    }
    function setTradeMarkers() {
      const markers = tradeMarkers(displayTrades());
      if (!markerPrimitive) markerPrimitive = LightweightCharts.createSeriesMarkers(priceSeries, markers);
      else markerPrimitive.setMarkers(markers);
    }
    const RECENT_TRADE_LIMIT = 10;
    function activeYear() { return appState.activeYear || 'all'; }
    function filteredTrades() {
      const year = activeYear();
      const type = document.getElementById('typeFilter').value;
      const span = spanWindow();
      let rows = displayTrades();
      if (span) rows = rows.filter(trade => trade.entryTime >= span.from && trade.entryTime <= span.to);
      if (year !== 'all') rows = rows.filter(trade => String(trade.year) === year);
      if (type === 'win') rows = rows.filter(trade => trade.isWin);
      if (type === 'loss') rows = rows.filter(trade => !trade.isWin);
      if (type === 'topWin') rows = rows.filter(trade => trade.isWin).sort((a, b) => b.return - a.return).slice(0, 10);
      if (type === 'topLoss') rows = rows.filter(trade => !trade.isWin).sort((a, b) => a.return - b.return).slice(0, 10);
      return rows;
    }
    // 表格默认只列最近 N 笔；选定年份或收益类型后给该范围内的全量
    function visibleTrades() {
      const rows = filteredTrades();
      if (activeYear() !== 'all' || appState.activeSpan !== 'all' || document.getElementById('typeFilter').value !== 'all') return rows;
      return rows.slice(-RECENT_TRADE_LIMIT);
    }
    // 价格图标题跟随周期，日/周视图没有 4h 均线
    function priceTitleText() {
      if (appState.timeframe === '1d') return 'BTC 日K（4h 聚合）';
      if (appState.timeframe === '1w') return 'BTC 周K（4h 聚合）';
      return 'BTC 4h K线 + MA11 / MA200D';
    }
    function setSeriesData() {
      const bars = viewBars();
      priceSeries.setData(candleData(bars));
      document.getElementById('priceChartTitle').textContent = priceTitleText();
      setTradeMarkers();
      // 日/周视图隐藏 4h 均线（采样值会误导），4h 恢复
      const showMa = appState.timeframe === '4h';
      maSeries.setData(showMa ? lineData(bars, 'ma') : []);
      ma200Series.setData(showMa ? lineData(bars, 'ma200d') : []);
      equitySeries.setData(lineData(bars, 'equity'));
      drawdownSeries.setData(lineData(bars, 'drawdown'));
    }
    // 回撤副图纵轴：0 贴顶，底部覆盖到本策略最深回撤
    function drawdownRange() {
      let min = 0;
      viewBars().forEach(row => { if (Number.isFinite(row.drawdown) && row.drawdown < min) min = row.drawdown; });
      return { minValue: min < 0 ? min * 1.08 : -0.05, maxValue: 0 };
    }
    // 副图统计：Calmar 与调仓次数都从 bars 现算；调仓＝杠杆目标变化的根数，
    // 与回测里 transaction_rate = |target_leverage - 上根| 同源。
    function drawdownStats() {
      const bars = DATA.bars || [];
      const maxdd = DATA.meta ? DATA.meta.maxDrawdown : null;
      let calmar = null;
      if (bars.length > 1) {
        const years = (bars[bars.length - 1].time - bars[0].time) / 86400 / 365.25;
        const total = bars[bars.length - 1].equity / bars[0].equity;
        if (years > 0 && total > 0 && maxdd < 0) calmar = (total ** (1 / years) - 1) / Math.abs(maxdd);
      }
      let switches = 0;
      for (let i = 1; i < bars.length; i += 1) {
        if (Math.abs((bars[i].leverage || 0) - (bars[i - 1].leverage || 0)) > 1e-12) switches += 1;
      }
      return { maxdd, calmar, switches };
    }
    function renderDdStats() {
      const stats = drawdownStats();
      document.getElementById('ddStats').textContent = [
        `最大回撤 ${pctText(stats.maxdd)}`,
        `Calmar ${Number.isFinite(stats.calmar) ? stats.calmar.toFixed(2) : '—'}`,
        `调仓 ${stats.switches} 次`,
      ].join(' · ');
    }
    // 覆盖条贴在净值/回撤 pane 分界线上方。pane 高度在数据、量表、时间轴变化后还会重算，
    // 只量一次会拿到旧值，所以分几帧重排，右边界对齐到时间轴宽（不压住价格轴）。
    function positionDdHead() {
      const meta = appState.chartMeta.get('equityChart');
      const head = document.getElementById('ddHead');
      if (!meta || !head) return;
      const panes = meta.chart.panes();
      if (panes.length < 2) { head.style.display = 'none'; return; }
      head.style.display = '';
      head.style.top = `${28 + panes[0].getHeight() + 2}px`;
      const host = document.getElementById('equityChart');
      const plotWidth = meta.chart.timeScale().width ? meta.chart.timeScale().width() : 0;
      head.style.right = plotWidth > 0 && host ? `${host.clientWidth - plotWidth + 8}px` : '10px';
    }
    function scheduleDdHead() {
      requestAnimationFrame(() => requestAnimationFrame(positionDdHead));
      [80, 300, 900].forEach(delay => setTimeout(positionDdHead, delay));
    }
    function renderCharts() {
      const priceChart = createBaseChart('priceChart');
      const equityChart = createBaseChart('equityChart');
      priceSeries = priceChart.addSeries(LightweightCharts.CandlestickSeries, {
        upColor: '#24b47e', downColor: '#e25561', borderUpColor: '#24b47e', borderDownColor: '#e25561', wickUpColor: '#24b47e', wickDownColor: '#e25561'
      });
      registerPrimarySeries('priceChart', priceSeries);
      maSeries = priceChart.addSeries(LightweightCharts.LineSeries, { color: colors.ma, lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
      ma200Series = priceChart.addSeries(LightweightCharts.LineSeries, { color: colors.ma200, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
      equitySeries = equityChart.addSeries(LightweightCharts.LineSeries, { color: colors.equity, lineWidth: 2, priceLineVisible: false, lastValueVisible: false });
      registerPrimarySeries('equityChart', equitySeries);
      // 回撤是净值图的副 pane：BaselineSeries 以 0 为基线，填充落在 0% 与曲线之间
      drawdownSeries = equityChart.addSeries(LightweightCharts.BaselineSeries, {
        baseValue: { type: 'price', price: 0 },
        topLineColor: 'rgba(255,90,103,0)', topFillColor1: 'rgba(255,90,103,0)', topFillColor2: 'rgba(255,90,103,0)',
        bottomLineColor: colors.dd, bottomFillColor1: 'rgba(255,90,103,.18)', bottomFillColor2: 'rgba(255,90,103,.04)',
        lineWidth: 1, priceLineVisible: false, lastValueVisible: false,
        priceFormat: { type: 'custom', formatter: (value) => `${(value * 100).toFixed(0)}%` },
        autoscaleInfoProvider: () => ({ priceRange: drawdownRange() }),
      }, 1);
      equityChart.applyOptions({
        grid: { horzLines: { color: colors.grid, style: LightweightCharts.LineStyle?.Dashed ?? 2 } },
      });
      const panes = equityChart.panes();
      if (panes.length > 1) {
        // 1:1 才能让纵轴自动落出 0/-20/-40/-60 的 20% 档；比例更小会退化成 -50% 档
        panes[0].setStretchFactor(1);
        panes[1].setStretchFactor(1);
        // 净值 pane 底部留白，净值曲线不压到副图标题条
        equityChart.priceScale('right', 0).applyOptions({ scaleMargins: { top: 0.08, bottom: 0.10 } });
        // 回撤 pane 顶部留出标题条空间，0% 线不贴边
        equityChart.priceScale('right', 1).applyOptions({ scaleMargins: { top: 0.18, bottom: 0.03 } });
      }
      setSeriesData();
      appState.chartMeta.forEach(meta => { syncVisibleRange(meta.chart); syncCrosshair(meta.chart); });
      // setVisibleRange/fitContent 是排队到下一帧生效的，这里不要再“读旧 range 再回写”，
      // 否则会把刚排队的 fitContent 覆盖成默认的几十根；区间由 applySpanRange 统一处理
      applySpanRange();
      scheduleDdHead();
    }
    // 顶部四档区间：按钮切换图表可视范围与逐笔表时间窗。起点净值取区间首根之前那根，
    // 与 annual_rows 的年起点口径一致，避免把首根自身的涨跌算进区间。
    const SPANS = [['y1', '1年', 1], ['y3', '3年', 3], ['y5', '5年', 5], ['all', '全部', 0]];
    function currentSpan(key = appState.activeSpan) {
      return SPANS.find(item => item[0] === key) || SPANS[SPANS.length - 1];
    }
    function spanWindow() {
      const span = currentSpan();
      const bars = DATA.bars;
      if (!bars || !bars.length || span[2] === 0) return null;
      const to = bars[bars.length - 1].time;
      return { from: spanStartTime(to, span[2]), to };
    }
    function spanStartTime(endTime, years) {
      const date = new Date(endTime * 1000);
      const target = new Date(date.getTime());
      target.setUTCFullYear(date.getUTCFullYear() - years);
      // 2-29 落到非闰年时 Date 会滚到 3-01，退回到上月最后一天
      if (target.getUTCMonth() !== date.getUTCMonth()) target.setUTCDate(0);
      return target.getTime() / 1000;
    }
    function spanReturn(bars, years) {
      if (!bars || !bars.length) return null;
      let start = 0;
      let base = 1;
      if (years > 0) {
        const threshold = spanStartTime(bars[bars.length - 1].time, years);
        while (start < bars.length && bars[start].time < threshold) start += 1;
        if (start >= bars.length) return null;
        base = start > 0 ? bars[start - 1].equity : 1;
      }
      const last = bars[bars.length - 1].equity;
      return Number.isFinite(base) && Number.isFinite(last) && base > 0 ? last / base - 1 : null;
    }
    function spanText(value) {
      if (!Number.isFinite(value)) return '—';
      const pct = value * 100;
      const body = Math.abs(pct) >= 1000
        ? Math.round(pct).toLocaleString('en-US')
        : pct.toFixed(Math.abs(pct) >= 100 ? 0 : 1);
      return `${pct >= 0 ? '+' : ''}${body}%`;
    }
    function renderSpans() {
      const active = appState.activeSpan;
      document.getElementById('spanBar').innerHTML = SPANS.map(([key, label, years]) => {
        const total = spanReturn(DATA.bars, years);
        const cls = !Number.isFinite(total) ? 'muted' : (total >= 0 ? 'long' : 'short');
        const on = key === active ? ' active' : '';
        return `<button type="button" class="spanCell${on}" data-span="${key}" aria-pressed="${key === active}"><span>${label}</span><strong class="${cls}">${spanText(total)}</strong></button>`;
      }).join('');
    }
    // 两图统一设区间：清掉排队的联动帧，避免 logicalRange 互相同步产生错位
    function setBothVisibleRange(range) {
      const sync = appState.rangeSync;
      if (sync.frame) { cancelAnimationFrame(sync.frame); sync.frame = null; }
      if (sync.releaseFrame) { cancelAnimationFrame(sync.releaseFrame); sync.releaseFrame = null; }
      sync.applying = true;
      appState.charts.forEach(chart => chart.timeScale().setVisibleRange(range));
      requestAnimationFrame(() => { sync.applying = false; sync.owner = null; sync.range = null; sync.logicalRange = null; });
    }
    function applySpanRange() {
      const span = currentSpan();
      const bars = viewBars();
      if (!bars.length) return;
      if (span[2] === 0) {
        appState.charts.forEach(chart => chart.timeScale().fitContent());
        return;
      }
      const to = bars[bars.length - 1].time;
      setBothVisibleRange({ from: spanStartTime(to, span[2]), to });
    }
    function selectSpan(key) {
      const span = currentSpan(key);
      appState.activeSpan = span[0];
      // 区间与年份是两个时间维度：选任意区间（含「全部」）都把年份退回全部，避免叠加出空表
      if (activeYear() !== 'all') {
        appState.activeYear = 'all';
        document.getElementById('yearFilter').value = 'all';
        renderAnnual();
      }
      // 5年及以上自动升到日线；手动选择不会被自动降回 4h
      if ((span[2] === 0 || span[2] >= 5) && appState.timeframe === '4h') switchTimeframe('1d');
      renderSpans();
      applySpanRange();
      renderTrades();
    }
    function applyTimeScaleOptions() {
      const timeVisible = appState.timeframe === '4h';
      appState.charts.forEach(chart => chart.applyOptions({ timeScale: { timeVisible } }));
    }
    // 切周期：记下当前时间范围 → 重建两图数据 → 按时间恢复范围（不用逻辑索引，防粒度错位）
    function switchTimeframe(tf) {
      const select = document.getElementById('timeframeFilter');
      if (tf === appState.timeframe) { select.value = tf; return; }
      const range = appState.charts[0] ? appState.charts[0].timeScale().getVisibleRange() : null;
      appState.timeframe = tf;
      select.value = tf;
      applyTimeScaleOptions();
      setSeriesData();
      if (range) setBothVisibleRange(range);
      else appState.charts.forEach(chart => chart.timeScale().fitContent());
      clearCrosshairAndTooltips();
      scheduleDdHead();
    }
    function renderStats() {
      const meta = DATA.meta;
      document.getElementById('strategySubtitle').textContent = `${DATA.label}｜${meta.description}｜${meta.execution}`;
      document.getElementById('equityTitle').textContent = meta.description;
      const items = [
        ['最终净值', numberText(meta.finalEquity, 2), 'long'],
        ['最大回撤', pctText(meta.maxDrawdown), 'short'],
      ['已平仓', meta.tradeCount, ''],
      ['持仓中', DATA.openPosition ? 1 : 0, DATA.openPosition ? 'long' : 'muted'],
        ['胜率', pctText(meta.winRate), ''],
        ['盈亏比', numberText(meta.profitLossRatio, 2), ''],
        ['暴露', pctText(meta.exposure), ''],
        ['均杠杆', numberText(meta.avgLeverage, 2), ''],
        ['止损', pctText(meta.stopLoss), '']
      ];
      document.getElementById('stats').innerHTML = items.map(([label, value, cls]) => `<div class="stat"><span>${label}</span><strong class="${cls}">${value}</strong></div>`).join('');
    }
    function renderAnnual() {
      const current = activeYear();
      document.getElementById('annualRows').innerHTML = DATA.annual.map(row => `<tr class="annualRow ${String(row.year) === String(current) ? 'active' : ''}" data-year="${row.year}"><td>${row.year}</td><td class="${row.yearEquity >= 1 ? 'long' : 'short'}">${numberText(row.yearEquity, 4)}x</td><td>${numberText(row.endEquity, 2)}</td><td class="short">${pctText(row.yearMdd)}</td></tr>`).join('');
      // 点年度行 = 只看该年交易，再点一次退回全部
      document.querySelectorAll('.annualRow').forEach(row => row.addEventListener('click', () => {
        const year = row.dataset.year;
        selectYear(String(activeYear()) === year ? 'all' : year);
      }));
    }
    function selectYear(year) {
      const select = document.getElementById('yearFilter');
      const next = String(year);
      appState.activeYear = [...select.options].some(item => item.value === next) ? next : 'all';
      select.value = appState.activeYear;
      // 年份是另一个时间维度：选具体年份时把区间退回「全部」，否则两个窗口叠加可能压成空表
      if (appState.activeYear !== 'all' && appState.activeSpan !== 'all') {
        appState.activeSpan = 'all';
        renderSpans();
      }
      renderAnnual();
      renderTrades();
    }
    function renderTrades() {
      const rows = visibleTrades();
      const total = displayTrades().length;
      const full = filteredTrades().length;
      document.getElementById('tradeCountLabel').textContent = rows.length < full ? `最近 ${rows.length} / ${total}` : `${rows.length} / ${total}`;
      document.getElementById('tradeRows').innerHTML = rows.map(trade => `<tr class="tradeRow ${trade.id === appState.activeTradeId ? 'active' : ''}" data-id="${trade.id}"><td>${trade.id || 'OPEN'}</td><td class="tradeCell">${trade.entryText.slice(0, 16)}<br><span class="price">$${numberText(trade.entryPrice, 2)}</span></td><td class="tradeCell">${trade.isOpen ? trade.markText.slice(0, 16) : trade.exitText.slice(0, 16)}<br><span class="price">$${numberText(trade.exitPrice, 2)}</span></td><td class="${trade.return >= 0 ? 'long' : 'short'}">${pctText(trade.return)}</td><td class="short">${pctText(trade.wear)}</td><td>${trade.bars}</td></tr>`).join('');
      document.querySelectorAll('.tradeRow').forEach(row => row.addEventListener('click', () => selectTrade(Number(row.dataset.id))));
    }
    function renderTradeDetail(trade) {
      const container = document.getElementById('selectedTradeDetail');
      if (!trade) {
        container.className = 'tradeDetail empty';
        container.textContent = '点击下方交易查看价格、手续费、资金费和总磨损。';
        return;
      }
      container.className = 'tradeDetail';
      const items = [
        ['入场价格', `$${numberText(trade.entryPrice, 2)}`],
        [trade.isOpen ? '标记价格' : '出场价格', `$${numberText(trade.exitPrice, 2)}`],
        ['价格变动', pctText(trade.priceReturn)],
        [trade.isOpen ? '未实现收益' : '净收益', pctText(trade.return)],
        ['手续费/滑点', pctText(trade.feeSlippage)],
        ['资金费', pctText(trade.funding)],
        ['总交易磨损', pctText(trade.wear)],
        [trade.isOpen ? '持仓状态' : '退出原因', trade.isOpen ? `持仓中 / ${trade.pendingAction}` : trade.exitReason]
      ];
      container.innerHTML = items.map(([label, value]) => `<div class="tradeDetailItem"><span>${label}</span><strong class="${label === '净收益' && trade.return >= 0 ? 'long' : label === '净收益' ? 'short' : label === '总交易磨损' ? 'short' : ''}">${value}</strong></div>`).join('');
    }
    function selectTrade(id) {
      appState.activeTradeId = id;
      const trade = displayTrades().find(item => item.id === id);
      if (!trade) return;
      document.getElementById('selectedTradeTitle').textContent = trade.isOpen
        ? `持仓 ${trade.entryText.slice(0, 16)} -> ${trade.markText.slice(0, 16)} ${pctText(trade.return)}`
        : `#${trade.id} ${trade.entryText.slice(0, 16)} -> ${trade.exitText.slice(0, 16)} ${pctText(trade.return)}`;
      renderTradeDetail(trade);
      setTradeMarkers();
      renderTrades();
      const padding = (appState.timeframe === '1w' ? 21 : 7) * 24 * 60 * 60;
      const endTime = trade.isOpen ? trade.markTime : trade.exitTime;
      appState.charts.forEach(chart => chart.timeScale().setVisibleRange({ from: trade.entryTime - padding, to: endTime + padding }));
    }
    function populateYears() {
      const current = activeYear();
      const years = ['all', ...Array.from(new Set(displayTrades().map(trade => trade.year))).sort()];
      document.getElementById('yearFilter').innerHTML = years.map(year => `<option value="${year}">${year === 'all' ? '全部' : year}</option>`).join('');
      const keep = years.some(year => String(year) === String(current)) ? String(current) : 'all';
      appState.activeYear = keep;
      document.getElementById('yearFilter').value = keep;
    }
    function switchStrategy(key) {
      DATA = PAYLOAD.datasets[key];
      appState.viewCache = null;
      appState.activeTradeId = null;
      document.getElementById('selectedTradeTitle').textContent = '未选择交易';
      renderTradeDetail(null);
      populateYears();
      renderSpans();
      renderDdStats();
      renderStats();
      renderAnnual();
      renderTrades();
      setSeriesData();
      clearCrosshairAndTooltips();
      applySpanRange();
    }
    function setupFilters() {
      const strategySelect = document.getElementById('strategyFilter');
      strategySelect.innerHTML = Object.entries(PAYLOAD.datasets).map(([key, data]) => `<option value="${key}">${data.label}</option>`).join('');
      strategySelect.value = PAYLOAD.default;
      strategySelect.addEventListener('change', () => switchStrategy(strategySelect.value));
      populateYears();
      document.getElementById('yearFilter').addEventListener('change', (event) => selectYear(event.target.value));
      document.getElementById('typeFilter').addEventListener('change', renderTrades);
      document.getElementById('spanBar').addEventListener('click', (event) => {
        const cell = event.target.closest('.spanCell');
        if (cell && cell.dataset.span) selectSpan(cell.dataset.span);
      });
      const timeframeSelect = document.getElementById('timeframeFilter');
      timeframeSelect.value = appState.timeframe;
      timeframeSelect.addEventListener('change', () => switchTimeframe(timeframeSelect.value));
      // 全图 = 回到「全部」档，避免按钮高亮与实际范围不一致
      document.getElementById('fitButton').addEventListener('click', () => selectSpan('all'));
    }
    function resizeCharts() {
      appState.chartMeta.forEach((meta, id) => {
        const container = document.getElementById(id);
        if (container) meta.chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
      scheduleDdHead();
    }
    function boot() {
      assertChartLibrary();
      setupFilters();
      renderSpans();
      renderDdStats();
      renderStats();
      renderAnnual();
      renderCharts();
      renderTrades();
      window.addEventListener('resize', resizeCharts);
    }
    // 页面不再内嵌快照：加载失败时没有旧数据可退，直接提示重试
    function showLoadError(error) {
      console.error('回测数据加载失败:', error);
      const notice = document.createElement('div');
      notice.className = 'loadError';
      notice.innerHTML = '<span>回测数据加载失败，可能是 worker 正在生成或登录已过期。</span>'
        + '<button type="button" id="retryLoad">重试</button>';
      document.querySelector('main').prepend(notice);
      notice.querySelector('#retryLoad').addEventListener('click', () => location.reload());
    }
    // v2 payload 把 4 档共享的 time/OHLC/MA 存成顶层列式 bars（未压缩 ~4MB、gzip 后 ~0.9MB），
    // 这里还原成对象数组，后面所有代码仍按 bar.time / bar.open 等旧结构读取
    function expandPayload(payload) {
      if (!payload || !Array.isArray(payload.bars) || !Array.isArray(payload.barFields)) return payload;
      const shared = payload.barFields;
      const own = payload.strategyFields || [];
      Object.values(payload.datasets).forEach(dataset => {
        const columns = dataset.bars || [];
        dataset.bars = payload.bars.map((row, index) => {
          const bar = {};
          for (let i = 0; i < shared.length; i += 1) bar[shared[i]] = row[i];
          const extra = columns[index] || [];
          for (let i = 0; i < own.length; i += 1) bar[own[i]] = extra[i];
          return bar;
        });
      });
      delete payload.bars;
      return payload;
    }
    async function loadLatestPayload() {
      let error = null;
      try {
        const response = await fetch('/api/btc-strategy/payload', { credentials: 'same-origin' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        PAYLOAD = expandPayload(await response.json());
        DATA = PAYLOAD.datasets[PAYLOAD.default];
      } catch (err) {
        error = err;
      }
      if (!DATA) { showLoadError(error); return; }
      boot();
    }
    loadLatestPayload();
  </script>
</body>
